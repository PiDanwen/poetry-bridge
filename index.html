<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>诗声成桥 · 语音小游戏</title>
<style>
  :root{
    --kai:"Kaiti SC","STKaiti","KaiTi","DFKai-SB","BiauKai","Noto Serif SC",serif;
    --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --ink:#1a1a1a;
    --ink-soft:#555;
    --ink-light:#999;
    --line:#1a1a1a;
    --line-soft:#d0d0d0;
    --bg:#f7f7f5;
    --panel:rgba(255,255,255,.92);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#e8e8e6;}
  body{font-family:var(--ui);}

  #app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  #game{
    position:relative;width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;
    overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 20px 60px rgba(0,0,0,.12);
    background:var(--bg);
  }
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:hidden;}

  /* ============ 桥节点状态（极简立方体） ============ */
  .node rect{transition:fill .35s ease, stroke .35s ease;}
  .node.pending rect{fill:#ffffff;stroke:var(--ink);stroke-width:2;}
  .node.pending text{fill:var(--ink);opacity:.85;}
  .node.lit rect{fill:var(--ink);stroke:var(--ink);stroke-width:2;}
  .node.lit text{fill:#ffffff;font-weight:600;}
  .node.active rect{animation:nodepulse 1.1s ease-in-out infinite;fill:#ffffff;}
  .node.active text{fill:var(--ink);}
  .node text.ch-hidden{filter:blur(4px);opacity:.3;}
  @keyframes nodepulse{
    0%,100%{stroke:var(--ink);stroke-width:2;}
    50%{stroke:var(--ink);stroke-width:4;}
  }

  /* ============ UI 面板 ============ */
  .panel{
    position:absolute;z-index:8;padding:10px 14px;border-radius:8px;
    background:var(--panel);border:1px solid var(--line-soft);
    box-shadow:0 4px 16px rgba(0,0,0,.06);color:var(--ink);user-select:none;
  }

  /* 左上：古诗名 */
  #poemPanel{top:18px;left:18px;min-width:236px;max-width:40%;}
  .poem-title{font-family:var(--kai);font-size:20px;letter-spacing:3px;color:var(--ink);}
  .poem-title .author{font-size:12px;color:var(--ink-light);letter-spacing:1px;margin-left:8px;font-family:var(--ui);}
  .poem-half{margin-top:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .poem-half .hb{font-family:var(--kai);font-size:42px;line-height:1.12;color:var(--ink);letter-spacing:10px;}
  .poem-half .tag{
    display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;color:var(--ink);
    border:1px solid var(--ink);white-space:nowrap;letter-spacing:1px;
  }
  .poem-hint{margin-top:8px;font-size:12.5px;color:var(--ink-soft);letter-spacing:1px;}
  .poem-hint .tag{
    display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;color:#fff;
    background:var(--ink);margin-right:6px;vertical-align:1px;
  }
  .poem-hint .hb{
    display:inline-block;margin-left:2px;color:var(--ink);font-size:16px;letter-spacing:3px;
    font-weight:600;font-family:var(--kai);
  }

  /* 右上：星星进度 */
  #starsPanel{top:18px;right:18px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
  .level-chip{
    font-family:var(--kai);font-size:14px;letter-spacing:2px;color:var(--ink);
    padding:3px 12px;border-radius:4px;border:1px solid var(--ink);
  }
  .star-row{display:flex;gap:3px;}
  .star-row svg{width:22px;height:22px;transition:transform .3s;}
  .star-row svg path{fill:none;stroke:var(--ink-light);stroke-width:1.5;}
  .star-row svg.on path{fill:var(--ink);stroke:var(--ink);}
  .star-row svg.on.boost{animation:starboost .6s ease;}
  @keyframes starboost{0%{transform:scale(.4) rotate(-30deg)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
  .stars-label{font-size:11px;color:var(--ink-light);letter-spacing:2px;}

  /* 右下：声音面板 */
  #voicePanel{right:18px;bottom:18px;width:236px;}
  .vp-row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .vp-row:first-child{margin-top:2px;}
  .vp-label{font-size:12px;color:var(--ink-soft);letter-spacing:1px;white-space:nowrap;}
  .meter{flex:1;height:8px;border-radius:4px;background:#e8e8e8;overflow:hidden;border:1px solid var(--line-soft);}
  .meter>i{
    display:block;height:100%;width:0%;border-radius:4px;
    background:var(--ink);
    transition:width .09s linear;
  }
  .meter>i.flash{animation:meterflash .28s ease;}
  @keyframes meterflash{0%{box-shadow:0 0 10px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 transparent}}
  .vp-num{font-size:12px;color:var(--ink);min-width:34px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{flex:1;accent-color:var(--ink);height:18px;cursor:pointer;}
  .vp-meta{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .vp-meta small{font-size:11px;color:var(--ink-light);letter-spacing:1px;}
  .btn-mini{
    font-family:var(--ui);font-size:11px;color:var(--ink);background:#fff;
    border:1px solid var(--ink);border-radius:4px;padding:2px 9px;cursor:pointer;letter-spacing:1px;
    transition:background .2s;
  }
  .btn-mini:hover{background:#f0f0f0;}

  /* 底部中央：麦克风 */
  #micWrap{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #micBtn{
    width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;
    background:#fff;
    box-shadow:0 4px 16px rgba(0,0,0,.1);
    display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s;
  }
  #micBtn:active{transform:scale(.94);}
  #micBtn svg{width:26px;height:26px;fill:var(--ink);}
  #micBtn.listening{background:var(--ink);}
  #micBtn.listening svg{fill:#fff;}
  #micBtn.listening::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ink);
    animation:micring 1.4s ease-out infinite;pointer-events:none;
  }
  @keyframes micring{0%{transform:scale(.82);opacity:.6}100%{transform:scale(1.4);opacity:0}}
  #micStatus{font-size:12.5px;color:var(--ink-soft);letter-spacing:2px;}

  /* 漂浮反馈 */
  .float{
    position:absolute;font-family:var(--kai);font-size:24px;color:var(--ink);
    animation:floatup 1.25s ease-out forwards;letter-spacing:2px;white-space:nowrap;
  }
  @keyframes floatup{
    0%{opacity:0;transform:translateY(14px) scale(.75)}
    18%{opacity:1;transform:translateY(0) scale(1.08)}
    100%{opacity:0;transform:translateY(-72px) scale(1)}
  }
  .starburst{position:absolute;font-size:18px;color:var(--ink);animation:burst .9s ease-out forwards;}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}

  #toast{
    position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:25;
    font-size:13px;color:#fff;letter-spacing:1px;padding:8px 18px;border-radius:6px;
    background:var(--ink);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ 覆盖层 ============ */
  .overlay{
    position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(247,247,245,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .45s ease;opacity:1;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .o-card{
    text-align:center;padding:40px 56px;border-radius:12px;
    background:#fff;
    border:1px solid var(--line-soft);
    box-shadow:0 20px 60px rgba(0,0,0,.08);
    max-width:88%;
  }
  .o-title{font-family:var(--kai);font-size:48px;letter-spacing:14px;color:var(--ink);padding-left:14px;}
  .o-sub{margin-top:10px;font-size:15px;color:var(--ink-soft);letter-spacing:4px;}
  .o-divider{width:180px;height:1px;margin:22px auto;background:var(--line-soft);}
  .o-steps{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .o-step{width:158px;font-size:13px;color:var(--ink-soft);line-height:1.9;letter-spacing:1px;}
  .o-step b{display:block;font-family:var(--kai);font-size:28px;color:var(--ink);font-weight:normal;margin-bottom:4px;}
  .o-btn{
    margin-top:28px;font-family:var(--kai);font-size:20px;letter-spacing:6px;color:#fff;padding-left:6px;
    border:none;border-radius:6px;cursor:pointer;
    background:var(--ink);
    padding:13px 46px;transition:transform .15s;
  }
  .o-btn:hover{transform:translateY(-2px);}
  .o-btn:active{transform:scale(.97);}
  /* 结算弹窗双按钮 */
  .o-actions{display:flex;gap:16px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
  .o-actions .o-btn{margin-top:0;}
  .o-btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:11px 30px;letter-spacing:4px;}
  .o-btn.ghost:hover{background:var(--ink);color:#fff;}
  .o-result{margin-top:8px;font-size:19px;color:var(--ink);letter-spacing:3px;font-family:var(--kai);}
  .o-note{margin-top:18px;font-size:12px;color:var(--ink-light);letter-spacing:1px;}
  .o-paper{font-family:var(--kai);font-size:16px;color:var(--ink-soft);letter-spacing:2px;margin-top:14px;max-width:760px;}

  /* ============ 结算弹窗：入场 + 星星点亮 ============ */
  #doneOverlay .o-card{animation:cardin .55s cubic-bezier(.18,.9,.28,1.15) both;}
  @keyframes cardin{
    0%{opacity:0;transform:translateY(26px) scale(.84)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .o-stars-big{display:flex;gap:16px;justify-content:center;margin-top:26px;}
  .o-stars-big svg{width:44px;height:44px;}
  .o-stars-big svg path{fill:none;stroke:var(--line-soft);stroke-width:1.6;transition:fill .25s, stroke .25s;}
  .o-stars-big svg.on path{fill:var(--ink);stroke:var(--ink);}
  .o-stars-big svg.on{animation:bigstar .6s cubic-bezier(.2,.9,.4,1.35) both;}
  .o-stars-big svg.tw{filter:drop-shadow(0 0 9px rgba(26,26,26,.4));}
  @keyframes bigstar{
    0%{transform:scale(.15) rotate(-45deg);opacity:0}
    55%{transform:scale(1.32) rotate(10deg);opacity:1}
    100%{transform:scale(1) rotate(0deg);opacity:1}
  }
  .o-count-roll{font-variant-numeric:tabular-nums;}
  @media (max-width:820px){
    .poem-title{font-size:16px;}
    .poem-half .hb{font-size:30px;letter-spacing:7px;}
    #poemPanel{min-width:0;}
    #voicePanel{width:190px;}
    #starsPanel .star-row svg{width:17px;height:17px;}
    .o-title{font-size:36px;letter-spacing:8px;}
    .o-step{width:124px;}
    .o-stars-big svg{width:34px;height:34px;}
  }
</style>
</head>
<body>
<div id="app">
<div id="game">

  <!-- ================= 场景 SVG（极简黑白） ================= -->
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- 背景 -->
    <rect width="1600" height="900" fill="#f7f7f5"/>

    <!-- 远处极简山峦轮廓（细线） -->
    <g fill="none" stroke="#d8d8d6" stroke-width="1.5">
      <path d="M0 560 Q 200 500 400 540 Q 600 580 800 520 Q 1000 470 1200 530 Q 1400 570 1600 540"/>
      <path d="M0 610 Q 250 570 500 600 Q 750 630 1000 580 Q 1250 540 1500 590 L1600 600"/>
    </g>

    <!-- 地面线 -->
    <line x1="0" y1="730" x2="1600" y2="730" stroke="#c8c8c6" stroke-width="1"/>

    <!-- 左右悬崖（极简几何） -->
    <g>
      <!-- 左悬崖 -->
      <path d="M0 590 L300 590 L300 900 L0 900 Z" fill="#ececea" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="0" y1="590" x2="300" y2="590" stroke="#1a1a1a" stroke-width="2.5"/>
      <!-- 右悬崖 -->
      <path d="M1600 590 L1300 590 L1300 900 L1600 900 Z" fill="#ececea" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="1600" y1="590" x2="1300" y2="590" stroke="#1a1a1a" stroke-width="2.5"/>
    </g>

    <!-- 衔接悬崖（JS 生成） -->
    <g id="cliffLayer"></g>

    <!-- 诗声桥 -->
    <g id="bridgeLayer">
      <g id="bridgeSegs"></g>
      <g id="nodesLayer"></g>
    </g>

    <!-- 火柴人 -->
    <g id="charLayer">
      <ellipse id="charShadow" cx="210" cy="595" rx="22" ry="4" fill="rgba(0,0,0,.12)"/>
      <g id="charRoot">
        <g id="charBody">
          <!-- 头 -->
          <circle cx="0" cy="-52" r="11" fill="none" stroke="#1a1a1a" stroke-width="3"/>
          <!-- 身体 -->
          <line x1="0" y1="-41" x2="0" y2="-8" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
          <!-- 左臂 -->
          <line x1="0" y1="-30" x2="-14" y2="-18" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
          <!-- 右臂 -->
          <line x1="0" y1="-30" x2="14" y2="-18" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
          <!-- 左腿 -->
          <line x1="0" y1="-8" x2="-9" y2="12" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
          <!-- 右腿 -->
          <line x1="0" y1="-8" x2="9" y2="12" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </svg>

  <!-- ================= UI ================= -->
  <!-- 左上：古诗名 + 当前半句 -->
  <div class="panel" id="poemPanel">
    <div class="poem-title"><span id="poemTitle">《静夜思》</span><span class="author" id="poemAuthor">唐 · 李白</span></div>
    <div class="poem-half"><span class="hb" id="curHalf">床前明月光</span><span class="tag" id="bridgeTag">第 1/4 桥</span></div>
    <div class="poem-hint" id="hintText">有 2 个字被遮住，凭记忆读出来点亮诗桥</div>
  </div>

  <!-- 右上：星星进度 -->
  <div class="panel" id="starsPanel">
    <div class="level-chip" id="levelChip">第 1 关</div>
    <div class="star-row" id="starRow"></div>
    <div class="stars-label" id="starsLabel">本关星辉 0 / 4</div>
  </div>

  <!-- 右下：声音 -->
  <div class="panel" id="voicePanel">
    <div class="vp-row">
      <span class="vp-label">声音音量</span>
      <div class="meter"><i id="volBar"></i></div>
      <span class="vp-num" id="volNum">0%</span>
    </div>
    <div class="vp-row">
      <span class="vp-label">声音灵敏度</span>
      <input type="range" id="sensSlider" min="0" max="100" value="45">
      <span class="vp-num" id="sensNum">45</span>
    </div>
    <div class="vp-meta">
      <small>识别模式：<span id="modeBadge">等待授权</span></small>
      <button class="btn-mini" id="demoBtn" style="display:none">演示模式</button>
      <button class="btn-mini" id="sfxBtn" title="音效开关">音效 开</button>
    </div>
  </div>

  <!-- 底部中央：麦克风 -->
  <div id="micWrap">
    <button id="micBtn" aria-label="开始朗读">
      <svg viewBox="0 0 24 24"><path d="M12 14.5a3 3 0 0 0 3-3v-6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17.5 11.5a5.5 5.5 0 0 1-11 0h-1.6a7.1 7.1 0 0 0 6.3 7v3h-2.2v1.6h5v-1.6h-2.1v-3a7.1 7.1 0 0 0 6.3-7z"/></svg>
    </button>
    <div id="micStatus">点击开始朗读</div>
  </div>

  <div id="fx"></div>
  <div id="toast"></div>

  <!-- 开始覆盖层 -->
  <div class="overlay" id="startOverlay">
    <div class="o-card">
      <div class="o-title">诗声成桥</div>
      <div class="o-sub">朗读古诗 · 点亮诗声之桥</div>
      <div class="o-divider"></div>
      <div class="o-steps">
        <div class="o-step"><b>一</b>允许打开麦克风权限</div>
        <div class="o-step"><b>二</b>大声读出诗句，被遮住的字凭记忆背出</div>
        <div class="o-step"><b>三</b>点亮一座座诗桥，走到对岸</div>
      </div>
      <button class="o-btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <!-- 通关覆盖层（结算弹窗） -->
  <div class="overlay hide" id="doneOverlay">
    <div class="o-card">
      <div class="o-title" id="doneTitle">闯关成功</div>
      <div class="o-paper" id="donePaper">四座诗桥尽数点亮</div>
      <div class="o-stars-big" id="doneStarRow"></div>
      <div class="o-result">本关点亮 <span class="o-count-roll" id="doneCount">0</span> / <span id="doneCountMax">4</span> 颗星</div>
      <div class="o-note" id="doneTotal">累计星星 0 / 20</div>
      <div class="o-actions">
        <button class="o-btn ghost" id="quitBtn">退出游戏</button>
        <button class="o-btn" id="restartBtn">重新开始</button>
      </div>
    </div>
  </div>

</div>
</div>

<script>
'use strict';
/* =========================================================
 * 诗声成桥 · 语音小游戏（黑白简洁版）
 * 玩法：朗读诗句 → 逐字点亮诗声桥 → 火柴人走过悬崖
 * 每一句（如「床前明月光」）就是一座独立的桥；
 * 一关之内必须读完古诗全部 4 句（4 座桥）才能通关。
 * 语音识别（Web Speech API）+ 音量节拍感应兜底 + 演示模式
 * ======================================================= */

/* ---------- 关卡数据：完整古诗 ---------- */
const LEVELS = [
  { title:'静夜思',   author:'唐 · 李白',   lines:['床前明月光','疑是地上霜','举头望明月','低头思故乡'] },
  { title:'春晓',     author:'唐 · 孟浩然', lines:['春眠不觉晓','处处闻啼鸟','夜来风雨声','花落知多少'] },
  { title:'登鹳雀楼', author:'唐 · 王之涣', lines:['白日依山尽','黄河入海流','欲穷千里目','更上一层楼'] },
  { title:'咏鹅',     author:'唐 · 骆宾王', lines:['鹅鹅鹅','曲项向天歌','白毛浮绿水','红掌拨清波'] },
  { title:'相思',     author:'唐 · 王维',   lines:['红豆生南国','春来发几枝','愿君多采撷','此物最相思'] },
];

/* 断句规则：每句五言（如「床前明月光」）即半句 = 一座桥，不再二次拆分 */
const TOTAL_STARS = LEVELS.reduce((s,l)=> s + l.lines.length, 0); // 5 关 × 4 桥 = 20 星

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const svgScene = $('#scene');
const nodesLayer = $('#nodesLayer');
const charRoot = $('#charRoot');
const charBody = $('#charBody');
const charShadow = $('#charShadow');
const bridgeSegs = $('#bridgeSegs');
const cliffLayer = $('#cliffLayer');
const fxLayer = $('#fx');

/* ---------- 状态 ---------- */
const state = {
  level:0, bridge:0, litInBridge:0,
  levelStars:0, stars:0, best:0,
  listening:false, micActive:false, walking:false, done:false,
  syllableMode:false, demoMode:false, recog:null,
  actx:null, master:null, analyser:null, stream:null,
  lastPeak:0, sens:45, sfxOn:true,
  charPos:{x:210,y:578},
};
try{ state.best = parseInt(localStorage.getItem('sycsb_best')||'0')||0; }catch(e){}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mk(tag){ return document.createElementNS(NS, tag); }

/* ---------- 关卡构建：每半句一座桥 ---------- */
let bridges = [], nodeEls = [], nodePts = [], hiddenSet = new Set();

/* 每座桥的节点高度模板（按桥序 4 座）：起伏范围约 546~714，波浪明显 */
const Y_TEMPLATE = [
  [618, 656, 698, 656, 618],
  [602, 564, 546, 564, 602],
  [634, 684, 714, 684, 634],
  [600, 574, 562, 574, 586],
];
let cliffs = [], cliffL = null, cliffR = null;

/* 计算全部汉字节点坐标：每句一座桥，桥与桥之间由衔接悬崖承接 */
const CLIFF_W = 84;
function layoutBridge(){
  const X0 = 320, GAP = 45, BETWEEN = 80;
  let cx = X0;
  bridges.forEach((b, j)=>{
    const n = b.text.length;
    const ys = Y_TEMPLATE[j].slice(0, n);
    b.xs = []; b.ys = [];
    for(let k=0;k<n;k++){
      b.xs.push(cx + k*GAP);
      b.ys.push(ys[k]);
    }
    cx += (n-1)*GAP + BETWEEN;
  });
  // 全部节点
  nodePts = [];
  bridges.forEach(b=>{ for(let k=0;k<b.xs.length;k++) nodePts.push({x:b.xs[k], y:b.ys[k]}); });
  // 衔接悬崖：崖顶 = 相邻桥端高度较高者（自然过渡，视觉上像一座座独立孤峰）
  cliffs = [];
  for(let j=0;j<bridges.length-1;j++){
    const a = bridges[j], b = bridges[j+1];
    const ax = a.xs[a.xs.length-1], ay = a.ys[a.ys.length-1];
    const bx = b.xs[0], by = b.ys[0];
    cliffs.push({ x:(ax+bx)/2, top: Math.max(ay, by) + 2 });
  }
  // 左右悬崖（顶面对齐 SVG 悬崖 y=590）
  cliffL = { right: X0 - 23, top: 590 };
  const last = bridges[bridges.length-1];
  cliffR = { left: last.xs[last.xs.length-1] + 23, top: 590 };
}

function smoothPath(pts){
  if(pts.length<2) return '';
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

/* 绘制桥面：极简虚线连接，无装饰 */
function drawBridges(){
  bridgeSegs.innerHTML = '';
  bridges.forEach((b, j)=>{
    const n = b.text.length;
    const sx = b.xs[0]-20, sy = j===0 ? cliffL.top : cliffs[j-1].top;
    const ex = b.xs[n-1]+20, ey = j===bridges.length-1 ? cliffR.top : cliffs[j].top;
    const pts = [{x:sx,y:sy}];
    for(let k=0;k<n;k++) pts.push({x:b.xs[k], y:b.ys[k]});
    pts.push({x:ex,y:ey});
    const d = smoothPath(pts);
    // 极简虚线桥面
    const line = mk('path');
    line.setAttribute('d', d);
    line.setAttribute('fill','none');
    line.setAttribute('stroke','#1a1a1a');
    line.setAttribute('stroke-width','2');
    line.setAttribute('stroke-dasharray','2 8');
    line.setAttribute('stroke-linecap','round');
    line.setAttribute('opacity','.5');
    bridgeSegs.appendChild(line);
  });
}

/* 绘制衔接悬崖（极简柱形崖壁，与左右悬崖同风格，直落画面底部） */
function buildCliffs(){
  cliffLayer.innerHTML = '';
  cliffs.forEach((c, i)=>{
    const g = mk('g');
    g.setAttribute('class','cliff');
    g.setAttribute('id','cliff-'+i);
    const w = CLIFF_W, x0 = c.x - w/2, x1 = c.x + w/2;
    // 崖壁：从崖顶直落画面底部
    const wall = mk('path');
    wall.setAttribute('d', `M ${x0} ${c.top} L ${x0} 900 L ${x1} 900 L ${x1} ${c.top} Z`);
    wall.setAttribute('fill','#ececea');
    wall.setAttribute('stroke','#1a1a1a');
    wall.setAttribute('stroke-width',2);
    g.appendChild(wall);
    // 崖顶线（加粗强调顶面）
    const topLine = mk('line');
    topLine.setAttribute('x1', x0); topLine.setAttribute('y1', c.top);
    topLine.setAttribute('x2', x1); topLine.setAttribute('y2', c.top);
    topLine.setAttribute('stroke','#1a1a1a');
    topLine.setAttribute('stroke-width',2.5);
    g.appendChild(topLine);
    // 崖壁细纹理（极简两条竖线）
    const tex1 = mk('line');
    tex1.setAttribute('x1', x0+16); tex1.setAttribute('y1', c.top+4);
    tex1.setAttribute('x2', x0+16); tex1.setAttribute('y2', 900);
    tex1.setAttribute('stroke','#d6d6d3'); tex1.setAttribute('stroke-width',1);
    g.appendChild(tex1);
    const tex2 = mk('line');
    tex2.setAttribute('x1', x1-16); tex2.setAttribute('y1', c.top+4);
    tex2.setAttribute('x2', x1-16); tex2.setAttribute('y2', 900);
    tex2.setAttribute('stroke','#d6d6d3'); tex2.setAttribute('stroke-width',1);
    g.appendChild(tex2);
    // 段号（刻在崖壁上，深色确保可读）
    const label = mk('text');
    label.setAttribute('x', c.x);
    label.setAttribute('y', Math.min(c.top + 40, 878));
    label.setAttribute('text-anchor','middle');
    label.setAttribute('dominant-baseline','central');
    label.setAttribute('font-size', 11);
    label.setAttribute('fill', '#1a1a1a');
    label.style.fontFamily = 'var(--ui)';
    label.textContent = '第 ' + (i+1) + ' 段';
    g.appendChild(label);
    // 段号阴影（浅色描边，增强可读性）
    const labelShadow = mk('text');
    labelShadow.setAttribute('x', c.x);
    labelShadow.setAttribute('y', Math.min(c.top + 40, 878));
    labelShadow.setAttribute('text-anchor','middle');
    labelShadow.setAttribute('dominant-baseline','central');
    labelShadow.setAttribute('font-size', 11);
    labelShadow.setAttribute('fill', 'none');
    labelShadow.setAttribute('stroke', '#ececea');
    labelShadow.setAttribute('stroke-width', 5);
    labelShadow.style.fontFamily = 'var(--ui)';
    labelShadow.textContent = '第 ' + (i+1) + ' 段';
    g.appendChild(labelShadow);
    cliffLayer.appendChild(g);
  });
}

function buildLevel(){
  const lv = LEVELS[state.level];
  // 半句桥数据：每句（5 字）即半句 = 一座桥，不再拆分
  bridges = [];
  let idx = 0;
  lv.lines.forEach((ln, li)=>{
    bridges.push({ text:ln, line:li, half:0, start:idx, end:idx+ln.length-1, lineStart:idx, hidden:[] });
    idx += ln.length;
  });
  const chars = bridges.reduce((a,b)=>a+b.text,'');
  // 随机模糊字：每桥约 40%（五言 2 个 / 三言 1 个），阅读 + 背诵结合
  hiddenSet = new Set();
  bridges.forEach(b=>{
    const n = b.text.length;
    const k = n>=5 ? 2 : 1;
    const pool = Array.from({length:n}, (_,i)=>i);
    for(let i=0;i<k && pool.length;i++){
      const p = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
      b.hidden.push(b.start+p);
      hiddenSet.add(b.start+p);
    }
  });
  layoutBridge();
  buildCliffs();
  drawBridges();

  // 节点（极简立方体）
  nodesLayer.innerHTML = '';
  nodeEls = [];
  for(let i=0;i<chars.length;i++){
    const g = mk('g');
    g.setAttribute('class','node pending');
    g.setAttribute('transform',`translate(${nodePts[i].x} ${nodePts[i].y})`);
    const r = mk('rect');
    r.setAttribute('x',-22); r.setAttribute('y',-22);
    r.setAttribute('width',44); r.setAttribute('height',44); r.setAttribute('rx',4);
    const t = mk('text');
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size',22); t.style.fontFamily='var(--kai)';
    t.textContent = chars[i];
    if(hiddenSet.has(i)) t.classList.add('ch-hidden');
    g.appendChild(r); g.appendChild(t);
    nodesLayer.appendChild(g);
    nodeEls.push(g);
  }

  // UI
  $('#poemTitle').textContent = '《'+lv.title+'》';
  $('#poemAuthor').textContent = lv.author;
  $('#levelChip').textContent = '第 '+(state.level+1)+' 关';
  buildStarRow();
  renderBridgePanel(0);
  // 小人归位到起点悬崖顶部
  state.charPos = {x:210,y:578};
  setChar(210,578,0,1,590);
}

/* ---------- 面板 UI（古诗名 + 当前半句大字） ---------- */
function renderBridgePanel(bi){
  const b = bridges[bi];
  state.bridge = bi;
  state.litInBridge = 0;
  $('#bridgeTag').textContent = '第 '+(bi+1)+' / '+bridges.length+' 桥';
  // 被遮住的字以「□」占位，需凭记忆读出
  const masked = [...b.text].map((c,i)=> b.hidden.includes(b.start+i) ? '□' : c).join('');
  $('#curHalf').textContent = masked;
  $('#hintText').textContent = b.hidden.length
    ? '有 '+b.hidden.length+' 个字被遮住，凭记忆读出来点亮诗桥'
    : '大声读出这些字，点亮第 '+(bi+1)+' 座诗桥';
  updateNodeStates();
}
function updateNodeStates(){
  const b = bridges[state.bridge];
  if(!b) return;
  nodeEls.forEach((el,i)=>{
    const lit = i < b.start + state.litInBridge;
    el.classList.toggle('lit', lit);
    el.classList.toggle('active', i === b.start + state.litInBridge && !state.done);
    const t = el.querySelector('text');
    if(t) t.classList.toggle('ch-hidden', !lit && hiddenSet.has(i));
  });
}

/* ---------- 星星（每座桥一颗，本关展示） ---------- */
function buildStarRow(){
  const n = bridges.length;
  const row = $('#starRow');
  row.innerHTML = '';
  for(let i=0;i<n;i++){
    const sv = document.createElementNS(NS,'svg');
    sv.setAttribute('viewBox','0 0 24 24');
    sv.innerHTML = '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>';
    row.appendChild(sv);
  }
  updateStarRow();
}
function updateStarRow(boostIdx){
  const svs = document.querySelectorAll('#starRow svg');
  svs.forEach((s,i)=>{
    s.classList.toggle('on', i < state.levelStars);
    s.classList.remove('boost');
    if(boostIdx!=null && i===boostIdx){ void s.getBoundingClientRect(); s.classList.add('boost'); }
  });
  $('#starsLabel').textContent = '本关星辉 '+state.levelStars+' / '+bridges.length;
}

/* ---------- 火柴人 ---------- */
function setChar(x, y, rot, scale, groundY){
  charRoot.setAttribute('transform',`translate(${x} ${y})`);
  charBody.setAttribute('transform',`rotate(${rot||0}) scale(${scale==null?1:scale})`);
  charShadow.setAttribute('cx', x);
  charShadow.setAttribute('cy', (groundY==null?y:groundY)+5);
}
function hopTo(p, dur=500, groundY){
  return new Promise(res=>{
    const from = {...state.charPos};
    const dx = p.x-from.x, dy = p.y-from.y;
    const gy0 = groundY==null ? from.y : groundY;
    const gy1 = groundY==null ? p.y : groundY;
    const t0 = performance.now();
    (function step(t){
      const k = Math.min(1,(t-t0)/dur);
      const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      const gx = from.x+dx*e, gy = from.y+dy*e;
      const gY = gy0 + (gy1-gy0)*e;
      const arc = Math.sin(Math.PI*k)*36;
      const rot = Math.sin(Math.PI*k)*11*Math.sign(dx||1);
      const sc = 1 - Math.sin(Math.PI*k)*0.08;
      setChar(gx, gy-arc, rot, sc, gY);
      if(k<1) requestAnimationFrame(step);
      else { state.charPos = {x:p.x,y:p.y}; setChar(p.x,p.y,0,1,gy1); res(); }
    })(t0);
  });
}

/* ---------- 音频 / 音效 ---------- */
function ensureAudio(){
  if(!state.actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    state.actx = new AC();
    state.master = state.actx.createGain();
    state.master.gain.value = 0.5;
    state.master.connect(state.actx.destination);
  }
  if(state.actx.state==='suspended') state.actx.resume();
}
const SCALE = [523.25,587.33,659.25,783.99,880.00,1046.50,1174.66,1318.51];
function pluck(freq, delay=0, dur=0.5, vol=0.22, type='triangle'){
  ensureAudio();
  if(!state.sfxOn || !state.actx) return;
  const t = state.actx.currentTime + delay;
  const o = state.actx.createOscillator(), g = state.actx.createGain();
  o.type = type; o.frequency.value = freq; o.detune.value = (Math.random()*8-4);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(state.master);
  o.start(t); o.stop(t+dur+0.05);
}
const noteFor = i => SCALE[i % SCALE.length];
function playLineArp(len){
  for(let i=0;i<Math.max(len,4);i++) pluck(noteFor(i), i*0.09);
}
function playFanfare(){
  [523.25,659.25,783.99,1046.50].forEach((f,i)=> pluck(f, i*0.13, 0.6, 0.24));
  pluck(1318.51, 0.56, 1.0, 0.2);
}
function playError(){ pluck(196, 0, 0.35, 0.16, 'sine'); }

/* ---------- 麦克风 ---------- */
async function enableMic(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-mic-api');
    state.stream = await navigator.mediaDevices.getUserMedia({audio:true});
    ensureAudio();
    if(!state.actx) throw new Error('no-audio');
    const src = state.actx.createMediaStreamSource(state.stream);
    state.analyser = state.actx.createAnalyser();
    state.analyser.fftSize = 1024;
    state.analyser.smoothingTimeConstant = 0.3;
    src.connect(state.analyser);
    state.micActive = true;
    return true;
  }catch(e){
    return false;
  }
}
function hasSpeech(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function setMode(m){
  const map = {speech:'语音识别', syllable:'节拍感应', demo:'演示模式'};
  $('#modeBadge').textContent = map[m] || m;
}
async function startListening(){
  if(state.walking || state.done || state.listening) return;
  ensureAudio();
  if(!state.micActive){
    const ok = await enableMic();
    if(!ok){
      // 麦克风不可用 → 提供演示模式
      state.demoMode = true;
      setMode('demo');
      $('#demoBtn').style.display = '';
      toast('未获得麦克风权限，已开启演示模式：点击麦克风可逐字点亮');
      state.listening = true;
      $('#micBtn').classList.add('listening');
      $('#micStatus').textContent = '演示模式 · 点击逐字点亮';
      return;
    }
  }
  state.listening = true;
  $('#micBtn').classList.add('listening');
  if(state.demoMode){
    setMode('demo');
    $('#micStatus').textContent = '演示模式 · 点击逐字点亮';
    return;
  }
  if(state.syllableMode){
    setMode('syllable');
    $('#micStatus').textContent = '正在聆听 · 逐字朗读';
  }else if(hasSpeech()){
    setMode('speech');
    $('#micStatus').textContent = '正在聆听…';
    startRecognition();
  }else{
    state.syllableMode = true;
    setMode('syllable');
    $('#micStatus').textContent = '正在聆听 · 逐字朗读';
    toast('已切换到节拍感应模式：请逐字大声朗读');
  }
}
function stopListening(){
  state.listening = false;
  $('#micBtn').classList.remove('listening');
  if(state.recog){ try{ state.recog.stop(); }catch(e){} state.recog = null; }
  $('#micStatus').textContent = '点击开始朗读';
}
function toggleMic(){
  if(state.done || state.walking) return;
  if(state.demoMode){
    registerSyllable();
    return;
  }
  if(state.listening) stopListening();
  else startListening();
}

/* ---------- 语音识别 ---------- */
function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(state.recog){ try{ state.recog.stop(); }catch(e){} }
  const rec = new SR();
  state.recog = rec;
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let errCount = 0;
  rec.onresult = e => {
    let txt = '';
    for(let i=e.resultIndex;i<e.results.length;i++) txt += e.results[i][0].transcript;
    handleText(txt);
  };
  rec.onerror = e => {
    if(e.error==='network' || e.error==='service-not-allowed'){
      errCount++;
      if(errCount>=2 && !state.syllableMode && !state.demoMode){
        state.syllableMode = true; setMode('syllable');
        $('#micStatus').textContent = '正在聆听 · 逐字朗读';
        toast('语音识别暂不可用，已切换为节拍感应模式');
      }
    }
  };
  rec.onend = () => {
    if(state.listening && !state.walking && !state.done){
      setTimeout(()=>{
        if(state.listening && !state.walking && !state.done){
          try{ rec.start(); }catch(e){}
        }
      }, 260);
    }
  };
  try{ rec.start(); }catch(e){}
}
function handleText(txt){
  if(state.done || state.walking || !state.listening) return;
  if(state.bridge >= bridges.length) return;
  const target = bridges[state.bridge].text;
  const norm = (txt||'').replace(/[^\u4e00-\u9fa5]/g,'');
  if(!norm) return;
  let m = 0;
  for(const ch of norm){
    if(ch === target[m]){ m++; if(m>=target.length) break; }
  }
  if(m > state.litInBridge){
    lightChars(m);
    if(m >= target.length) bridgeComplete();
  }
}

/* ---------- 点亮 / 判定 ---------- */
function lightChars(k){
  const b = bridges[state.bridge];
  const len = b.text.length;
  k = Math.min(k, len);
  for(let i=state.litInBridge;i<k;i++){
    nodeEls[b.start+i].classList.add('lit');
    pluck(noteFor(i), 0, 0.45);
  }
  state.litInBridge = Math.max(state.litInBridge, k);
  updateNodeStates();
}
function registerSyllable(){
  if(state.done || state.walking) return;
  const b = bridges[state.bridge];
  const len = b.text.length;
  if(state.litInBridge >= len) return;
  lightChars(state.litInBridge+1);
  const bar = $('#volBar');
  if(state.demoMode){
    bar.style.width = Math.min(100, state.litInBridge*100/len)+'%';
    $('#volNum').textContent = Math.round(state.litInBridge*100/len)+'%';
  }
  bar.classList.remove('flash'); void bar.getBoundingClientRect(); bar.classList.add('flash');
  if(state.litInBridge >= len) bridgeComplete();
}

/* 一座桥读完：点亮本桥 → 得星 → 火柴人从桥头走到桥尾悬崖 → 下一座桥 */
async function bridgeComplete(){
  if(state.done || state.walking) return;
  stopListening();
  state.walking = true;
  const b = bridges[state.bridge];
  const len = b.text.length;

  playLineArp(len);
  // 得星（每座桥一颗）
  state.levelStars++;
  state.stars++;
  updateStarRow(state.levelStars-1);
  spawnFloat('桥通啦！ +1 星', '56%', '28%');

  // 先走到桥头（起点悬崖或上一座衔接悬崖）
  const CLIFF_TOP = 590;
  const startPt = state.bridge===0
    ? {x:210, y:CLIFF_TOP-12}
    : {x:cliffs[state.bridge-1].x, y:cliffs[state.bridge-1].top - 12};
  const startGY = state.bridge===0 ? CLIFF_TOP : cliffs[state.bridge-1].top;
  if(Math.hypot(startPt.x-state.charPos.x, startPt.y-state.charPos.y) > 2) await hopTo(startPt, 420, startGY);
  // 逐字走过本桥（站在节点顶部）
  for(let k=0;k<len;k++) await hopTo({x:b.xs[k], y:b.ys[k]-34}, 430, b.ys[k]-22);
  // 走到桥尾：衔接悬崖或终点悬崖
  const endPt = state.bridge===bridges.length-1
    ? {x:cliffR.left+34, y:CLIFF_TOP-12}
    : {x:cliffs[state.bridge].x, y:cliffs[state.bridge].top - 12};
  const endGY = state.bridge===bridges.length-1 ? CLIFF_TOP : cliffs[state.bridge].top;
  await hopTo(endPt, 430, endGY);

  state.bridge++;
  state.litInBridge = 0;
  if(state.bridge >= bridges.length){ await finishLevel(); return; }
  renderBridgePanel(state.bridge);
  state.walking = false;
  setTimeout(()=>{ startListening(); }, 650);
}

async function finishLevel(){
  state.walking = false;
  state.done = true;
  playFanfare();
  const lv = LEVELS[state.level];
  const n = bridges.length;
  const earned = state.levelStars;
  if(state.stars > state.best){
    state.best = state.stars;
    try{ localStorage.setItem('sycsb_best', String(state.best)); }catch(e){}
  }

  // 文案
  $('#doneTitle').textContent = '闯关成功';
  $('#donePaper').textContent = '「'+lv.title+'」'+n+' 座诗桥尽数点亮';
  $('#doneCount').textContent = '0';
  $('#doneCountMax').textContent = n;
  $('#doneTotal').textContent = '累计星星 '+state.stars+' / '+TOTAL_STARS;

  // 星星行：先全部灰显
  const row = $('#doneStarRow');
  row.innerHTML = '';
  for(let i=0;i<n;i++){
    const sv = document.createElementNS(NS,'svg');
    sv.setAttribute('viewBox','0 0 24 24');
    sv.innerHTML = '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>';
    row.appendChild(sv);
  }

  // 打开弹窗（重新触发入场动画）
  const overlay = $('#doneOverlay');
  overlay.classList.remove('hide');
  const card = overlay.querySelector('.o-card');
  card.style.animation = 'none';
  void card.getBoundingClientRect();
  card.style.animation = '';

  // 数字滚动 + 星星逐个点亮
  await countUp($('#doneCount'), 0, earned, 750);
  for(let i=0;i<earned;i++){
    await sleep(170);
    const sv = row.children[i];
    sv.classList.add('on');
    pluck(SCALE[i%SCALE.length], 0, 0.55, 0.22);
    starPulse(overlay);
    void sv.getBoundingClientRect();
    sv.classList.add('tw');
  }
  // 全部点亮后：标题星芒绽放 + 庆祝飘字
  await sleep(260);
  burstStars(overlay);
  spawnFloat('走过悬崖啦！', '50%', '46%');
}

/* ---------- 特效 ---------- */
let toastTimer=null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
function spawnFloat(text, lx, ly){
  const d = document.createElement('div');
  d.className = 'float';
  d.textContent = text;
  d.style.left = lx; d.style.top = ly;
  d.style.transform = 'translateX(-50%)';
  fxLayer.appendChild(d);
  setTimeout(()=> d.remove(), 1400);
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function burstStars(container){
  const host = container || fxLayer;
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);';
  host.appendChild(d);
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.className = 'starburst';
    s.textContent = '★';
    const ang = (i/10)*Math.PI*2;
    s.style.setProperty('--dx', (Math.cos(ang)*140)+'px');
    s.style.setProperty('--dy', (Math.sin(ang)*90-40)+'px');
    s.style.animationDelay = (i*0.05)+'s';
    d.appendChild(s);
  }
  setTimeout(()=> d.remove(), 1400);
}
/* 每颗星点亮时的星芒 */
function starPulse(container){
  const host = container || fxLayer;
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);';
  host.appendChild(d);
  for(let i=0;i<6;i++){
    const s = document.createElement('span');
    s.className = 'starburst';
    s.textContent = '✦';
    const ang = (i/6)*Math.PI*2;
    s.style.setProperty('--dx', (Math.cos(ang)*66)+'px');
    s.style.setProperty('--dy', (Math.sin(ang)*44-8)+'px');
    s.style.animationDelay = (i*0.045)+'s';
    d.appendChild(s);
  }
  setTimeout(()=> d.remove(), 1200);
}
/* 数字滚动 */
function countUp(el, from, to, dur){
  const t0 = performance.now();
  return new Promise(res=>{
    (function step(t){
      const k = Math.min(1,(t-t0)/dur);
      const e = 1-Math.pow(1-k,3);
      el.textContent = Math.round(from+(to-from)*e);
      if(k<1) requestAnimationFrame(step); else res();
    })(t0);
  });
}

/* ---------- 主循环 ---------- */
function loop(){
  requestAnimationFrame(loop);
  // 待机呼吸
  if(!state.walking){
    const t = performance.now();
    const bob = Math.sin(t/380)*3;
    setChar(state.charPos.x, state.charPos.y + bob, 0, 1 + Math.sin(t/520)*0.015, state.charPos.y + 12);
  }
  // 音量检测
  if(state.micActive && state.analyser){
    const data = new Uint8Array(state.analyser.fftSize);
    state.analyser.getByteTimeDomainData(data);
    let sum=0;
    for(let i=0;i<data.length;i++){ const d=(data[i]-128)/128; sum += d*d; }
    const rms = Math.sqrt(sum/data.length);
    const pct = Math.min(100, Math.round(rms/0.5*100));
    $('#volBar').style.width = pct+'%';
    $('#volNum').textContent = pct+'%';
    if(state.syllableMode && state.listening && !state.walking && !state.done){
      const gate = 0.04 + state.sens/100*0.12;
      const now = performance.now();
      if(rms > gate && now - state.lastPeak > 300){
        state.lastPeak = now;
        registerSyllable();
      }
    }
  }
}

/* ---------- 事件 ---------- */
$('#startBtn').addEventListener('click', ()=>{
  $('#startOverlay').classList.add('hide');
  buildLevel();
  startListening();
});
$('#restartBtn').addEventListener('click', ()=>{
  // 重新开始本关：扣回本关已得星星（防重复刷星），从本关第一座桥重玩
  $('#doneOverlay').classList.add('hide');
  state.stars = Math.max(0, state.stars - state.levelStars);
  state.levelStars = 0;
  state.done = false;
  buildLevel();
  startListening();
});
$('#quitBtn').addEventListener('click', ()=>{
  // 退出游戏：停止朗读、关闭结算弹窗、返回开始界面并重置进度
  stopListening();
  state.level = 0;
  state.stars = 0;
  state.levelStars = 0;
  state.bridge = 0;
  state.litInBridge = 0;
  state.done = false;
  $('#doneOverlay').classList.add('hide');
  $('#startOverlay').classList.remove('hide');
});
$('#micBtn').addEventListener('click', toggleMic);
$('#sensSlider').addEventListener('input', e=>{
  state.sens = +e.target.value;
  $('#sensNum').textContent = state.sens;
});
$('#sfxBtn').addEventListener('click', ()=>{
  state.sfxOn = !state.sfxOn;
  $('#sfxBtn').textContent = state.sfxOn ? '音效 开' : '音效 关';
});
$('#demoBtn').addEventListener('click', ()=>{
  state.demoMode = true;
  setMode('demo');
  $('#micStatus').textContent = '演示模式 · 点击逐字点亮';
  toast('演示模式：点击麦克风逐字点亮');
  stopListening();
});

/* ---------- 启动 ---------- */
buildLevel();
loop();
</script>
