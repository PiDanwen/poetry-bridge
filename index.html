<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>诗声成桥 · 古风语音小游戏</title>
<style>
  :root{
    --kai:"Kaiti SC","STKaiti","KaiTi","DFKai-SB","BiauKai","Noto Serif SC",serif;
    --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --gold:#ffd98a; --gold-deep:#e8a53c; --gold-bright:#fff3cf;
    --teal:#0a3a3e; --ink:#062a2e;
    --panel:linear-gradient(180deg, rgba(8,38,44,.82), rgba(5,26,32,.62));
    --line:rgba(255,217,138,.30);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#03151b;}
  body{font-family:var(--ui);}

  #app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  #game{
    position:relative;width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;
    overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px rgba(255,217,138,.12), 0 24px 80px rgba(0,0,0,.6);
    background:#062a2e;
  }
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:hidden;}

  /* ============ 场景动画 ============ */
  .star{animation:twinkle var(--d,3.2s) ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.95}}
  .firefly{animation:fly var(--d,18s) ease-in-out infinite;}
  @keyframes fly{
    0%,100%{transform:translate(0,0);opacity:0}
    10%{opacity:.95}
    30%{transform:translate(var(--x1,26px),var(--y1,-38px))}
    55%{transform:translate(var(--x2,-20px),var(--y2,-66px))}
    78%{transform:translate(var(--x3,32px),var(--y3,-22px))}
    88%{opacity:.8}
  }
  .firefly .core{animation:flyblink 1.6s ease-in-out infinite;}
  @keyframes flyblink{0%,100%{opacity:1}50%{opacity:.35}}
  .cloud{animation:drift var(--d,30s) ease-in-out infinite alternate;}
  @keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(24px)}}
  .moonwrap{animation:moonbob 7s ease-in-out infinite;transform-origin:center;}
  @keyframes moonbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* 桥节点状态 */
  .node rect{transition:fill .4s ease, stroke .4s ease, filter .4s ease;}
  .node.pending rect{fill:rgba(34,74,72,.60);stroke:rgba(255,217,138,.22);}
  .node.pending text{fill:#a7d3c6;opacity:.9;}
  .node.lit rect{fill:url(#nodeGrad);stroke:#ffe9a8;filter:drop-shadow(0 0 10px rgba(255,214,120,.85));}
  .node.lit text{fill:#4a3006;font-weight:600;}
  .node.active rect{animation:nodepulse 1.1s ease-in-out infinite;fill:rgba(44,84,82,.70);}
  .node.active text{fill:#fff3d0;}
  /* 被墨迹遮住的字：模糊 + 墨色，需凭记忆读出 */
  .node text.ch-hidden{filter:blur(5px);fill:#31413e;opacity:.62;}
  @keyframes nodepulse{
    0%,100%{stroke:#fff3cf;stroke-width:3;filter:drop-shadow(0 0 8px rgba(180,230,220,.55));}
    50%{stroke:#a8f0de;stroke-width:1.5;filter:drop-shadow(0 0 15px rgba(140,230,215,.85));}
  }

  /* ============ UI 面板 ============ */
  .panel{
    position:absolute;z-index:8;padding:10px 14px;border-radius:14px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 6px 26px rgba(0,0,0,.35);color:#eaf6ee;user-select:none;
  }
  .panel::before{
    content:"";position:absolute;left:8px;right:8px;top:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,217,138,.55),transparent);
  }

  /* 左上：古诗名 */
  #poemPanel{top:18px;left:18px;min-width:236px;max-width:40%;}
  .poem-title{font-family:var(--kai);font-size:21px;letter-spacing:3px;color:var(--gold-bright);text-shadow:0 0 14px rgba(255,214,120,.45);}
  .poem-title .author{font-size:12px;color:#9fcfc0;letter-spacing:1px;margin-left:8px;font-family:var(--ui);}
  .poem-half{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .poem-half .hb{font-family:var(--kai);font-size:46px;line-height:1.12;color:var(--gold-bright);letter-spacing:10px;text-shadow:0 0 20px rgba(255,214,120,.55);animation:hintglow 1.6s ease-in-out infinite;}
  .poem-half .tag{
    display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;color:#ffe9a8;
    border:1px solid rgba(255,217,138,.4);white-space:nowrap;letter-spacing:1px;
  }
  .poem-hint{margin-top:8px;font-size:12.5px;color:#c9e6da;letter-spacing:1px;}
  .poem-hint .tag{
    display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;color:#ffe9a8;
    border:1px solid rgba(255,217,138,.4);margin-right:6px;vertical-align:1px;
  }
  .poem-hint .hb{
    display:inline-block;margin-left:2px;color:#ffd76a;font-size:16px;letter-spacing:3px;
    font-weight:600;text-shadow:0 0 12px rgba(255,215,106,.7);font-family:var(--kai);
    animation:hintglow 1.4s ease-in-out infinite;
  }
  @keyframes hintglow{0%,100%{text-shadow:0 0 8px rgba(255,215,106,.5)}50%{text-shadow:0 0 18px rgba(255,220,130,.95)}}

  /* 右上：星星进度 */
  #starsPanel{top:18px;right:18px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
  .level-chip{
    font-family:var(--kai);font-size:14px;letter-spacing:2px;color:var(--gold-bright);
    padding:3px 12px;border-radius:20px;border:1px solid var(--line);
    background:rgba(255,217,138,.08);
  }
  .star-row{display:flex;gap:3px;}
  .star-row svg{width:22px;height:22px;transition:transform .3s;}
  .star-row svg.on{filter:drop-shadow(0 0 6px rgba(255,214,120,.8));}
  .star-row svg.on.boost{animation:starboost .6s ease;}
  @keyframes starboost{0%{transform:scale(.4) rotate(-30deg)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
  .stars-label{font-size:11px;color:#9fcfc0;letter-spacing:2px;}

  /* 右下：声音面板 */
  #voicePanel{right:18px;bottom:18px;width:236px;}
  .vp-row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .vp-row:first-child{margin-top:2px;}
  .vp-label{font-size:12px;color:#c9e6da;letter-spacing:1px;white-space:nowrap;}
  .meter{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
  .meter>i{
    display:block;height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#4fae8c,#ffd76a,#ffb45e);
    transition:width .09s linear;
  }
  .meter>i.flash{animation:meterflash .28s ease;}
  @keyframes meterflash{0%{box-shadow:0 0 14px rgba(255,220,140,.95)}100%{box-shadow:0 0 0 transparent}}
  .vp-num{font-size:12px;color:var(--gold-bright);min-width:34px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{flex:1;accent-color:var(--gold-deep);height:18px;cursor:pointer;}
  .vp-meta{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .vp-meta small{font-size:11px;color:#9fcfc0;letter-spacing:1px;}
  .btn-mini{
    font-family:var(--ui);font-size:11px;color:#ffe9a8;background:rgba(255,217,138,.10);
    border:1px solid rgba(255,217,138,.35);border-radius:12px;padding:2px 9px;cursor:pointer;letter-spacing:1px;
    transition:background .2s;
  }
  .btn-mini:hover{background:rgba(255,217,138,.22);}

  /* 底部中央：麦克风 */
  #micWrap{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #micBtn{
    width:74px;height:74px;border-radius:50%;border:2px solid var(--gold-bright);cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffe9ad, #e8a53c 68%, #c9872a);
    box-shadow:0 8px 26px rgba(0,0,0,.4), 0 0 22px rgba(255,214,120,.45), inset 0 2px 4px rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s;
  }
  #micBtn:active{transform:scale(.94);}
  #micBtn svg{width:30px;height:30px;fill:#4a3006;}
  #micBtn.listening::after{
    content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,225,150,.65);
    animation:micring 1.4s ease-out infinite;pointer-events:none;
  }
  @keyframes micring{0%{transform:scale(.82);opacity:.95}100%{transform:scale(1.45);opacity:0}}
  #micStatus{font-size:12.5px;color:#c9e6da;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.6);}

  /* 漂浮反馈 */
  .float{
    position:absolute;font-family:var(--kai);font-size:27px;color:var(--gold-bright);
    text-shadow:0 0 16px rgba(255,214,120,.9), 0 2px 6px rgba(0,0,0,.6);
    animation:floatup 1.25s ease-out forwards;letter-spacing:2px;white-space:nowrap;
  }
  @keyframes floatup{
    0%{opacity:0;transform:translateY(14px) scale(.75)}
    18%{opacity:1;transform:translateY(0) scale(1.08)}
    100%{opacity:0;transform:translateY(-72px) scale(1)}
  }
  .starburst{position:absolute;font-size:20px;color:var(--gold-bright);text-shadow:0 0 10px rgba(255,214,120,.9);animation:burst .9s ease-out forwards;}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}

  #toast{
    position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:25;
    font-size:13px;color:#fff3d0;letter-spacing:1px;padding:8px 18px;border-radius:20px;
    background:rgba(6,30,36,.9);border:1px solid var(--line);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ 覆盖层 ============ */
  .overlay{
    position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(3,18,22,.74);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity .45s ease;opacity:1;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .o-card{
    text-align:center;padding:38px 54px;border-radius:22px;
    background:linear-gradient(180deg, rgba(10,44,50,.94), rgba(6,30,36,.92));
    border:1px solid rgba(255,217,138,.35);
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    max-width:88%;
  }
  .o-title{font-family:var(--kai);font-size:52px;letter-spacing:14px;color:var(--gold-bright);text-shadow:0 0 26px rgba(255,214,120,.55);padding-left:14px;}
  .o-sub{margin-top:10px;font-size:15px;color:#c9e6da;letter-spacing:4px;}
  .o-divider{width:210px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,rgba(255,217,138,.7),transparent);}
  .o-steps{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .o-step{width:158px;font-size:13px;color:#9fcfc0;line-height:1.9;letter-spacing:1px;}
  .o-step b{display:block;font-family:var(--kai);font-size:30px;color:var(--gold);font-weight:normal;margin-bottom:4px;}
  .o-btn{
    margin-top:28px;font-family:var(--kai);font-size:21px;letter-spacing:6px;color:#4a3006;padding-left:6px;
    border:none;border-radius:40px;cursor:pointer;
    background:linear-gradient(180deg,#ffe9ad,#e8a53c);box-shadow:0 10px 30px rgba(232,165,60,.35), inset 0 2px 4px rgba(255,255,255,.5);
    padding:13px 46px;transition:transform .15s;
  }
  .o-btn:hover{transform:translateY(-2px);}
  .o-btn:active{transform:scale(.97);}
  .o-result{margin-top:8px;font-size:19px;color:#fff3d0;letter-spacing:3px;font-family:var(--kai);}
  .o-result .stars-big{font-size:34px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 18px rgba(255,214,120,.7);}
  .o-note{margin-top:18px;font-size:12px;color:#8fbfae;letter-spacing:1px;}
  .o-paper{font-family:var(--kai);font-size:16px;color:#ffd98a;letter-spacing:2px;margin-top:14px;max-width:760px;}
  .o-paper span{display:inline-block;margin:0 3px;}
  .o-paper span.on{color:#fff3d0;text-shadow:0 0 12px rgba(255,214,120,.8);}
  @media (max-width:820px){
    .poem-title{font-size:16px;}
    .poem-half .hb{font-size:30px;letter-spacing:7px;}
    #poemPanel{min-width:0;}
    #voicePanel{width:190px;}
    #starsPanel .star-row svg{width:17px;height:17px;}
    .o-title{font-size:36px;letter-spacing:8px;}
    .o-step{width:124px;}
  }
</style>
</head>
<body>
<div id="app">
<div id="game">

  <!-- ================= 场景 SVG ================= -->
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#042029"/>
        <stop offset=".42" stop-color="#09383c"/>
        <stop offset=".78" stop-color="#104e4a"/>
        <stop offset="1" stop-color="#186259"/>
      </linearGradient>
      <radialGradient id="moonHalo" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="rgba(255,222,140,.85)"/>
        <stop offset=".38" stop-color="rgba(255,214,120,.28)"/>
        <stop offset="1" stop-color="rgba(255,214,120,0)"/>
      </radialGradient>
      <radialGradient id="lanternGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="rgba(255,214,120,.75)"/>
        <stop offset="1" stop-color="rgba(255,214,120,0)"/>
      </radialGradient>
      <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1e413c"/>
        <stop offset="1" stop-color="#0c2b2c"/>
      </linearGradient>
      <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9ad"/>
        <stop offset="1" stop-color="#e8a53c"/>
      </linearGradient>
      <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(14,62,60,.0)"/>
        <stop offset=".5" stop-color="rgba(11,48,50,.55)"/>
        <stop offset="1" stop-color="rgba(6,28,32,.95)"/>
      </linearGradient>
      <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
    </defs>

    <!-- 夜空 -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>

    <!-- 星光（JS 生成） -->
    <g id="starsLayer"></g>

    <!-- 明月 -->
    <g class="moonwrap">
      <circle cx="1150" cy="235" r="170" fill="url(#moonHalo)"/>
      <circle cx="1150" cy="235" r="46" fill="#ffe9ad"/>
      <ellipse cx="1138" cy="222" rx="8" ry="6" fill="rgba(190,150,80,.28)"/>
      <ellipse cx="1163" cy="247" rx="6" ry="9" fill="rgba(190,150,80,.22)"/>
      <circle cx="1150" cy="235" r="50" fill="none" stroke="rgba(255,236,180,.35)" stroke-width="1.5"/>
    </g>

    <!-- 薄云 -->
    <g fill="rgba(191,227,216,.30)">
      <g class="cloud" style="--d:34s"><path d="M120 210 Q180 175 250 195 Q300 170 360 192 Q340 218 280 214 Q210 228 150 220 Q110 224 120 210 Z"/></g>
      <g class="cloud" style="--d:41s;animation-delay:-12s"><path d="M640 140 Q700 108 765 128 Q815 104 872 126 Q852 150 792 147 Q724 160 668 152 Q628 156 640 140 Z"/></g>
      <g class="cloud" style="--d:38s;animation-delay:-22s"><path d="M1330 330 Q1390 300 1452 318 Q1500 296 1556 314 Q1538 336 1480 333 Q1414 344 1360 336 Q1322 340 1330 330 Z"/></g>
    </g>

    <!-- 远山层 -->
    <g>
      <path d="M0 558 C 180 470, 320 472, 470 542 C 620 610, 760 498, 920 546 C 1100 600, 1260 500, 1420 542 L 1600 522 L 1600 646 L 0 646 Z" fill="#104a46" opacity=".60"/>
      <path d="M0 602 L 120 540 L 260 582 L 420 502 L 560 562 L 700 520 L 860 592 L 1000 546 L 1140 602 L 1300 550 L 1450 592 L 1600 566 L 1600 686 L 0 686 Z" fill="#0b3a39" opacity=".78"/>
      <path d="M0 642 L 180 600 L 360 642 L 520 600 L 700 648 L 880 610 L 1060 648 L 1240 616 L 1420 652 L 1600 620 L 1600 726 L 0 726 Z" fill="#08312f"/>
      <rect y="520" width="1600" height="130" fill="url(#mistGrad)" opacity=".55"/>
    </g>

    <!-- 竹林剪影（JS 生成） -->
    <g id="bambooLayer"></g>

    <!-- 山谷雾 -->
    <rect y="640" width="1600" height="260" fill="url(#mistGrad)"/>

    <!-- 左右悬崖 -->
    <g>
      <path d="M0 590 L300 590 L306 622 L286 662 L318 706 L262 766 L244 838 L196 900 L0 900 Z" fill="url(#cliffGrad)"/>
      <path d="M0 590 H300" stroke="#5fae9a" stroke-width="2.5" opacity=".65"/>
      <path d="M1600 590 L1300 590 L1293 626 L1316 668 L1284 714 L1338 772 L1304 842 L1352 900 L1600 900 Z" fill="url(#cliffGrad)"/>
      <path d="M1600 590 H1300" stroke="#5fae9a" stroke-width="2.5" opacity=".65"/>
      <!-- 崖边草簇 -->
      <g stroke="#3f8d78" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
        <path d="M60 590 q-6 -12 -14 -14 M60 590 q2 -13 8 -17 M60 590 q8 -9 15 -8"/>
        <path d="M250 590 q-6 -12 -14 -14 M250 590 q2 -13 8 -17 M250 590 q8 -9 15 -8"/>
        <path d="M1330 590 q-6 -12 -14 -14 M1330 590 q2 -13 8 -17 M1330 590 q8 -9 15 -8"/>
        <path d="M1540 590 q-6 -12 -14 -14 M1540 590 q2 -13 8 -17 M1540 590 q8 -9 15 -8"/>
      </g>
      <!-- 崖面碎石 -->
      <g fill="rgba(10,42,44,.9)">
        <ellipse cx="120" cy="700" rx="26" ry="12"/>
        <ellipse cx="80" cy="790" rx="34" ry="15"/>
        <ellipse cx="200" cy="850" rx="30" ry="13"/>
        <ellipse cx="1480" cy="710" rx="26" ry="12"/>
        <ellipse cx="1520" cy="800" rx="34" ry="15"/>
        <ellipse cx="1400" cy="860" rx="30" ry="13"/>
      </g>
      <!-- 右崖小松 -->
      <g>
        <path d="M1475 590 v-46" stroke="#0c2f2c" stroke-width="8" stroke-linecap="round"/>
        <path d="M1475 544 q-40 -16 -54 -44 q30 4 54 -16 q24 20 54 16 q-14 28 -54 44 Z" fill="#0c2f2c"/>
        <path d="M1475 498 q-30 -12 -40 -34 q22 3 40 -12 q18 15 40 12 q-10 22 -40 34 Z" fill="#0a2a28"/>
      </g>
    </g>

    <!-- 萤火虫（JS 生成） -->
    <g id="fireflyLayer"></g>

    <!-- 衔接石台（JS 生成） -->
    <g id="platformLayer"></g>

    <!-- 诗声桥：每半句一座桥 -->
    <g id="bridgeLayer">
      <path id="bridgeGlow" fill="none" stroke="rgba(255,217,138,.15)" stroke-width="22" filter="url(#softGlow)"/>
      <g id="bridgeLinks"></g>
      <g id="bridgeSegs"></g>
      <g id="nodesLayer"></g>
    </g>

    <!-- 小人 -->
    <g id="charLayer">
      <ellipse id="charShadow" cx="250" cy="596" rx="30" ry="6" fill="rgba(0,0,0,.30)"/>
      <g id="charRoot">
        <g id="charBody">
          <!-- 衣袍 -->
          <path d="M -27 0 C -31 -22 -25 -46 0 -53 C 25 -46 31 -22 27 0 Z" fill="#f4ecd8"/>
          <!-- 腰带 -->
          <rect x="-26" y="-31" width="52" height="9" rx="4.5" fill="#b23a2c"/>
          <circle cx="0" cy="-26.5" r="4" fill="#e8c06a"/>
          <path d="M0 -34 v15" stroke="#8f2f24" stroke-width="2.5" opacity=".8"/>
          <!-- 双袖 -->
          <circle cx="-28" cy="-33" r="8.5" fill="#f4ecd8"/>
          <circle cx="28" cy="-33" r="8.5" fill="#f4ecd8"/>
          <!-- 提灯（右手） -->
          <g transform="translate(36 -38)">
            <line x1="0" y1="0" x2="0" y2="12" stroke="#8a5a2b" stroke-width="2.2"/>
            <rect x="-8" y="12" width="16" height="19" rx="4" fill="#ffd98a"/>
            <path d="M-8 15 h16 M-8 28 h16" stroke="#e8a53c" stroke-width="1.4"/>
            <rect x="-8" y="8" width="16" height="4.5" rx="2" fill="#8a5a2b"/>
            <circle cx="0" cy="21.5" r="19" fill="url(#lanternGlow)" opacity=".6"/>
          </g>
          <!-- 头 -->
          <circle cx="0" cy="-65" r="26" fill="#ffe2c2"/>
          <!-- 刘海 -->

<script>
'use strict';
/* =========================================================
 * 诗声成桥 · 古风语音小游戏
 * 玩法：朗读诗句 → 逐字点亮诗声桥 → 小人走过悬崖
 * 每一半句（如「床前明月光」）就是一座独立的桥；
 * 一关之内必须读完古诗全部半句（4 座桥）才能通关。
 * 语音识别（Web Speech API）+ 音量节拍感应兜底 + 演示模式
 * ======================================================= */

/* ---------- 关卡数据：完整古诗 ---------- */
const LEVELS = [
  { title:'静夜思',   author:'唐 · 李白',   lines:['床前明月光','疑是地上霜','举头望明月','低头思故乡'] },
  { title:'春晓',     author:'唐 · 孟浩然', lines:['春眠不觉晓','处处闻啼鸟','夜来风雨声','花落知多少'] },
  { title:'登鹳雀楼', author:'唐 · 王之涣', lines:['白日依山尽','黄河入海流','欲穷千里目','更上一层楼'] },
  { title:'咏鹅',     author:'唐 · 骆宾王', lines:['鹅鹅鹅','曲项向天歌','白毛浮绿水','红掌拨清波'] },
  { title:'相思',     author:'唐 · 王维',   lines:['红豆生南国','春来发几枝','愿君多采撷','此物最相思'] },
];

/* 断句规则：每句五言（如「床前明月光」）即半句 = 一座桥，不再二次拆分 */
const TOTAL_STARS = LEVELS.reduce((s,l)=> s + l.lines.length, 0); // 5 关 × 4 桥 = 20 星

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const svgScene = $('#scene');
const nodesLayer = $('#nodesLayer');
const charRoot = $('#charRoot');
const charBody = $('#charBody');
const charShadow = $('#charShadow');
const bridgeGlow = $('#bridgeGlow');
const bridgeSegs = $('#bridgeSegs');
const bridgeLinks = $('#bridgeLinks');
const platformLayer = $('#platformLayer');
const fxLayer = $('#fx');

/* ---------- 状态 ---------- */
const state = {
  level:0, bridge:0, litInBridge:0,
  levelStars:0, stars:0, best:0,
  listening:false, micActive:false, walking:false, done:false,
  syllableMode:false, demoMode:false, recog:null,
  actx:null, master:null, analyser:null, stream:null,
  lastPeak:0, sens:45, sfxOn:true,
  charPos:{x:210,y:612},
};
try{ state.best = parseInt(localStorage.getItem('sycsb_best')||'0')||0; }catch(e){}

/* ---------- 场景生成：星光 / 萤火虫 / 竹林 ---------- */
(function buildScene(){
  const rand = mulberry32(20260817);
  // 星光
  const stars = $('#starsLayer');
  for(let i=0;i<46;i++){
    const c = mk('circle');
    const x = rand()*1600, y = rand()*430;
    const r = 0.6 + rand()*1.4;
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
    c.setAttribute('fill','#ffe9b8');
    c.setAttribute('class','star');
    c.style.setProperty('--d',(2.4+rand()*3.6)+'s');
    c.style.animationDelay = (-rand()*4)+'s';
    stars.appendChild(c);
  }
  // 萤火虫
  const flies = $('#fireflyLayer');
  for(let i=0;i<13;i++){
    const g = mk('g');
    g.setAttribute('class','firefly');
    g.setAttribute('transform',`translate(${120+rand()*1360} ${430+rand()*330})`);
    g.style.setProperty('--d',(15+rand()*12)+'s');
    g.style.animationDelay = (-rand()*18)+'s';
    g.style.setProperty('--x1',(20+rand()*40)+'px');
    g.style.setProperty('--y1',(-25+rand()*50-20)+'px');
    g.style.setProperty('--x2',(-15+rand()*30-15)+'px');
    g.style.setProperty('--y2',(-45+rand()*60-30)+'px');
    g.style.setProperty('--x3',(20+rand()*40)+'px');
    g.style.setProperty('--y3',(-10+rand()*30)+'px');
    const halo = mk('circle'); halo.setAttribute('r','7'); halo.setAttribute('fill','rgba(255,214,120,.22)');
    const core = mk('circle'); core.setAttribute('r','1.7'); core.setAttribute('fill','#fff7d6'); core.setAttribute('class','core');
    g.appendChild(halo); g.appendChild(core);
    flies.appendChild(g);
  }
  // 竹林（左右剪影）
  const bamboos = $('#bambooLayer');
  const clusters = [
    {x:60,  base:720, hs:[330,400,270,350], color:'#0a2f2e', leaf:'#0c332f'},
    {x:170, base:740, hs:[290,360,240],     color:'#09302f', leaf:'#0b332f'},
    {x:1490,base:730, hs:[340,410,280],     color:'#0a2f2e', leaf:'#0c332f'},
    {x:1380,base:750, hs:[300,370,250],     color:'#09302f', leaf:'#0b332f'},
    {x:420, base:700, hs:[240,180],         color:'#0b3331', leaf:'#0d3531'},
    {x:1180,base:700, hs:[230,170],         color:'#0b3331', leaf:'#0d3531'},
  ];
  clusters.forEach(cl=>{
    cl.hs.forEach((h,hi)=>{
      drawBamboo(bamboos, cl.x + hi*22 - 14, cl.base, h, (hi%2? 26:-18), cl.color, cl.leaf);
    });
  });
})();
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mk(tag){ return document.createElementNS(NS, tag); }
function drawBamboo(g, x, base, h, lean, color, leafColor){
  const p = mk('path');
  p.setAttribute('d',`M ${x} ${base} C ${x+lean*0.25} ${base-h*0.5}, ${x+lean*0.72} ${base-h*0.82}, ${x+lean} ${base-h}`);
  p.setAttribute('fill','none'); p.setAttribute('stroke',color); p.setAttribute('stroke-width','9');
  p.setAttribute('stroke-linecap','round');
  g.appendChild(p);
  for(let i=1;i<=4;i++){
    const t=i/5, yy = base - h*t;
    const xx = x + lean*(0.4*t*t + 0.6*t);
    const j = mk('line');
    j.setAttribute('x1',xx-9); j.setAttribute('y1',yy); j.setAttribute('x2',xx+9); j.setAttribute('y2',yy);
    j.setAttribute('stroke',color); j.setAttribute('stroke-width','3'); j.setAttribute('opacity','.85');
    g.appendChild(j);
  }
  [[0.62,0.30,1],[0.45,0.52,-1],[0.80,0.55,1],[0.58,0.78,-1]].forEach(([t,fy,s])=>{
    const yy = base - h*t;
    const xx = x + lean*(0.4*t*t + 0.6*t);
    const d = s*20;
    const lf = mk('path');
    lf.setAttribute('d',`M ${xx} ${yy} q ${d} -16 ${d} -3 q ${-d*0.55} ${10} ${-d*0.35} ${1} z`);
    lf.setAttribute('fill',leafColor); lf.setAttribute('opacity','.92');
    g.appendChild(lf);
  });
}

/* ---------- 关卡构建：每半句一座桥 ---------- */
let bridges = [], nodeEls = [], nodePts = [], hiddenSet = new Set();

/* 每座桥的节点高度模板（按桥序 4 座）：起伏范围约 546~714，波浪明显 */
const Y_TEMPLATE = [
  [618, 656, 698, 656, 618],
  [602, 564, 546, 564, 602],
  [634, 684, 714, 684, 634],
  [600, 574, 562, 574, 586],
];
let platforms = [], cliffL = null, cliffR = null;

/* 计算全部汉字节点坐标：每半句一座桥，桥与桥之间由浮空石台衔接 */
function layoutBridge(){
  const X0 = 340, GAP = 45, BETWEEN = 68;
  let cx = X0;
  bridges.forEach((b, j)=>{
    const n = b.text.length;
    const ys = Y_TEMPLATE[j].slice(0, n);
    b.xs = []; b.ys = [];
    for(let k=0;k<n;k++){
      b.xs.push(cx + k*GAP);
      b.ys.push(ys[k]);
    }
    cx += (n-1)*GAP + BETWEEN;
  });
  // 全部节点
  nodePts = [];
  bridges.forEach(b=>{ for(let k=0;k<b.xs.length;k++) nodePts.push({x:b.xs[k], y:b.ys[k]}); });
  // 衔接石台：中心 = 相邻桥端中点，顶面 = 桥端高度均值 + 14
  platforms = [];
  for(let j=0;j<bridges.length-1;j++){
    const a = bridges[j], b = bridges[j+1];
    const ax = a.xs[a.xs.length-1], ay = a.ys[a.ys.length-1];
    const bx = b.xs[0], by = b.ys[0];
    platforms.push({ x:(ax+bx)/2, ty:(ay+by)/2 + 14 });
  }
  // 左右悬崖
  cliffL = { right: X0 - 23, top: bridges[0].ys[0] + 14 };
  const last = bridges[bridges.length-1];
  cliffR = { left: last.xs[last.xs.length-1] + 23, top: last.ys[last.ys.length-1] + 14 };
}

function smoothPath(pts){
  if(pts.length<2) return '';
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

/* 绘制桥面：每半句一座独立小桥，从上一石台/悬崖出发，落到下一石台/悬崖 */
function drawBridges(){
  bridgeSegs.innerHTML = '';
  bridgeLinks.innerHTML = '';
  // 整条桥链光晕
  const all = [{x:cliffL.right, y:cliffL.top}];
  bridges.forEach(b=>{ for(let k=0;k<b.xs.length;k++) all.push({x:b.xs[k], y:b.ys[k]}); });
  all.push({x:cliffR.left, y:cliffR.top});
  bridgeGlow.setAttribute('d', smoothPath(all));
  // 每座桥
  bridges.forEach((b, j)=>{
    const n = b.text.length;
    const sx = b.xs[0]-20, sy = j===0 ? cliffL.top : platforms[j-1].ty;
    const ex = b.xs[n-1]+20, ey = j===bridges.length-1 ? cliffR.top : platforms[j].ty;
    const pts = [{x:sx,y:sy}];
    for(let k=0;k<n;k++) pts.push({x:b.xs[k], y:b.ys[k]});
    pts.push({x:ex,y:ey});
    const d = smoothPath(pts);
    // 桥体厚度（柔和光带）
    const deck = mk('path');
    deck.setAttribute('d', d);
    deck.setAttribute('fill','none');
    deck.setAttribute('stroke','rgba(255,217,138,.16)');
    deck.setAttribute('stroke-width','15');
    deck.setAttribute('stroke-linecap','round');
    bridgeSegs.appendChild(deck);
    // 金色虚线桥面
    const line = mk('path');
    line.setAttribute('d', d);
    line.setAttribute('fill','none');
    line.setAttribute('stroke','rgba(255,217,138,.82)');
    line.setAttribute('stroke-width','3.5');
    line.setAttribute('stroke-dasharray','1 11');
    line.setAttribute('stroke-linecap','round');
    bridgeSegs.appendChild(line);
    // 桥头石柱 + 顶灯（两端）
    [[sx,sy],[ex,ey]].forEach(([px,py])=>{
      const post = mk('path');
      post.setAttribute('d', `M ${px} ${py-4} L ${px} ${py+30}`);
      post.setAttribute('stroke','#8a5a2b'); post.setAttribute('stroke-width','5'); post.setAttribute('stroke-linecap','round');
      bridgeSegs.appendChild(post);
      const cap = mk('circle');
      cap.setAttribute('cx',px); cap.setAttribute('cy',py-6); cap.setAttribute('r',5);
      cap.setAttribute('fill','#ffd98a'); cap.setAttribute('filter','url(#softGlow)');
      bridgeSegs.appendChild(cap);
    });
  });
}

/* 绘制衔接石台（浮空小悬崖） */
function buildPlatforms(){
  platformLayer.innerHTML = '';
  platforms.forEach((p, i)=>{
    const g = mk('g');
    const w = 58;
    const rock = mk('path');
    rock.setAttribute('d', `M ${p.x-w/2} ${p.ty} H ${p.x+w/2} L ${p.x+w/2-7} ${p.ty+30} Q ${p.x+4} ${p.ty+54} ${p.x-w/2+7} ${p.ty+30} Z`);
    rock.setAttribute('fill','url(#cliffGrad)');
    g.appendChild(rock);
    const bottom = mk('path');
    bottom.setAttribute('d', `M ${p.x-w/2+7} ${p.ty+30} Q ${p.x} ${p.ty+54} ${p.x+w/2-7} ${p.ty+30}`);
    bottom.setAttribute('fill','none'); bottom.setAttribute('stroke','rgba(95,174,154,.4)'); bottom.setAttribute('stroke-width','2');
    g.appendChild(bottom);
    const top = mk('line');
    top.setAttribute('x1',p.x-w/2); top.setAttribute('y1',p.ty);
    top.setAttribute('x2',p.x+w/2); top.setAttribute('y2',p.ty);
    top.setAttribute('stroke','#5fae9a'); top.setAttribute('stroke-width','2.5'); top.setAttribute('opacity','.6');
    g.appendChild(top);
    // 顶面草簇
    const grass = mk('path');
    grass.setAttribute('d', `M ${p.x-18} ${p.ty} q -4 -10 -10 -12 M ${p.x-18} ${p.ty} q 2 -11 8 -13 M ${p.x+16} ${p.ty} q -4 -10 -10 -12 M ${p.x+16} ${p.ty} q 2 -11 8 -13`);
    grass.setAttribute('stroke','#3f8d78'); grass.setAttribute('stroke-width','2'); grass.setAttribute('stroke-linecap','round'); grass.setAttribute('fill','none'); grass.setAttribute('opacity','.75');
    g.appendChild(grass);
    // 侧壁悬垂藤
    const vine = mk('path');
    vine.setAttribute('d', `M ${p.x-14} ${p.ty+8} q -8 10 -5 20 M ${p.x+14} ${p.ty+8} q 8 10 5 20`);
    vine.setAttribute('stroke','#2f6b5e'); vine.setAttribute('stroke-width','2'); vine.setAttribute('stroke-linecap','round'); vine.setAttribute('fill','none'); vine.setAttribute('opacity','.7');
    g.appendChild(vine);
    // 小松 / 小石点缀（部分石台）
    if(i%3===1){
      const tree = mk('g');
      tree.setAttribute('transform',`translate(${p.x+20} ${p.ty})`);
      const trunk = mk('line');
      trunk.setAttribute('x1',0); trunk.setAttribute('y1',0); trunk.setAttribute('x2',0); trunk.setAttribute('y2',-13);
      trunk.setAttribute('stroke','#0c2f2c'); trunk.setAttribute('stroke-width','3.5'); trunk.setAttribute('stroke-linecap','round');
      tree.appendChild(trunk);
      const crown = mk('path');
      crown.setAttribute('d','M0 -13 q-11 -5 -15 -13 q8 1 15 -5 q7 4 15 5 q-4 8 -15 13 Z');
      crown.setAttribute('fill','#0c2f2c');
      tree.appendChild(crown);
      g.appendChild(tree);
    }else if(i%3===2){
      const stone = mk('ellipse');
      stone.setAttribute('cx',p.x-19); stone.setAttribute('cy',p.ty-3); stone.setAttribute('rx',7); stone.setAttribute('ry',5);
      stone.setAttribute('fill','rgba(12,46,44,.9)');
      g.appendChild(stone);
    }
    platformLayer.appendChild(g);
  });
}

function buildLevel(){
  const lv = LEVELS[state.level];
  // 半句桥数据：每句（5 字）即半句 = 一座桥，不再拆分
  bridges = [];
  let idx = 0;
  lv.lines.forEach((ln, li)=>{
    bridges.push({ text:ln, line:li, half:0, start:idx, end:idx+ln.length-1, lineStart:idx, hidden:[] });
    idx += ln.length;
  });
  const chars = bridges.reduce((a,b)=>a+b.text,'');
  // 随机模糊字：每桥约 40%（五言 2 个 / 三言 1 个），阅读 + 背诵结合
  hiddenSet = new Set();
  bridges.forEach(b=>{
    const n = b.text.length;
    const k = n>=5 ? 2 : 1;
    const pool = Array.from({length:n}, (_,i)=>i);
    for(let i=0;i<k && pool.length;i++){
      const p = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
      b.hidden.push(b.start+p);
      hiddenSet.add(b.start+p);
    }
  });
  layoutBridge();
  buildPlatforms();
  drawBridges();

  // 节点
  nodesLayer.innerHTML = '';
  nodeEls = [];
  for(let i=0;i<chars.length;i++){
    const g = mk('g');
    g.setAttribute('class','node pending');
    g.setAttribute('transform',`translate(${nodePts[i].x} ${nodePts[i].y})`);
    const r = mk('rect');
    r.setAttribute('x',-23); r.setAttribute('y',-23);
    r.setAttribute('width',46); r.setAttribute('height',46); r.setAttribute('rx',9);
    const t = mk('text');
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size',24); t.style.fontFamily='var(--kai)';
    t.textContent = chars[i];
    if(hiddenSet.has(i)) t.classList.add('ch-hidden');
    g.appendChild(r); g.appendChild(t);
    nodesLayer.appendChild(g);
    nodeEls.push(g);
  }

  // UI
  $('#poemTitle').textContent = '《'+lv.title+'》';
  $('#poemAuthor').textContent = lv.author;
  $('#levelChip').textContent = '第 '+(state.level+1)+' 关';
  buildStarRow();
  renderBridgePanel(0);
  // 小人归位到起点悬崖
  state.charPos = {x:210,y:612};
  setChar(210,612,0,1,612);
}

/* ---------- 面板 UI（古诗名 + 当前半句大字） ---------- */
function renderBridgePanel(bi){
  const b = bridges[bi];
  state.bridge = bi;
  state.litInBridge = 0;
  $('#bridgeTag').textContent = '第 '+(bi+1)+' / '+bridges.length+' 桥';
  // 被墨迹遮住的字以「□」占位，需凭记忆读出
  const masked = [...b.text].map((c,i)=> b.hidden.includes(b.start+i) ? '□' : c).join('');
  $('#curHalf').textContent = masked;
  $('#hintText').textContent = b.hidden.length
    ? '有 '+b.hidden.length+' 个字被墨迹遮住，凭记忆读出来点亮诗桥'
    : '大声读出这些字，点亮第 '+(bi+1)+' 座诗桥';
  updateNodeStates();
}
function updateNodeStates(){
  const b = bridges[state.bridge];
  if(!b) return;
  nodeEls.forEach((el,i)=>{
    const lit = i < b.start + state.litInBridge;
    el.classList.toggle('lit', lit);
    el.classList.toggle('active', i === b.start + state.litInBridge && !state.done);
    const t = el.querySelector('text');
    if(t) t.classList.toggle('ch-hidden', !lit && hiddenSet.has(i));
  });
}

/* ---------- 星星（每座桥一颗，本关展示） ---------- */
function buildStarRow(){
  const n = bridges.length;
  const row = $('#starRow');
  row.innerHTML = '';
  for(let i=0;i<n;i++){
    const sv = document.createElementNS(NS,'svg');
    sv.setAttribute('viewBox','0 0 24 24');
    sv.innerHTML = '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>';
    row.appendChild(sv);
  }
  updateStarRow();
}
function updateStarRow(boostIdx){
  const svs = document.querySelectorAll('#starRow svg');
  svs.forEach((s,i)=>{
    s.classList.toggle('on', i < state.levelStars);
    s.classList.remove('boost');
    if(boostIdx!=null && i===boostIdx){ void s.getBoundingClientRect(); s.classList.add('boost'); }
  });
  $('#starsLabel').textContent = '本关星辉 '+state.levelStars+' / '+bridges.length;
}

/* ---------- 小人 ---------- */
function setChar(x, y, rot, scale, groundY){
  charRoot.setAttribute('transform',`translate(${x} ${y})`);
  charBody.setAttribute('transform',`rotate(${rot||0}) scale(${scale==null?1:scale})`);
  charShadow.setAttribute('cx', x);
  charShadow.setAttribute('cy', (groundY==null?y:groundY)+5);
}
function hopTo(p, dur=500){
  return new Promise(res=>{
    const from = {...state.charPos};
    const dx = p.x-from.x, dy = p.y-from.y;
    const t0 = performance.now();
    (function step(t){
      const k = Math.min(1,(t-t0)/dur);
      const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      const gx = from.x+dx*e, gy = from.y+dy*e;
      const arc = Math.sin(Math.PI*k)*36;
      const rot = Math.sin(Math.PI*k)*11*Math.sign(dx||1);
      const sc = 1 - Math.sin(Math.PI*k)*0.08;
      setChar(gx, gy-arc, rot, sc, gy);
      if(k<1) requestAnimationFrame(step);
      else { state.charPos = {x:p.x,y:p.y}; setChar(p.x,p.y,0,1,p.y); res(); }
    })(t0);
  });
}

/* ---------- 音频 / 音效 ---------- */
function ensureAudio(){
  if(!state.actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    state.actx = new AC();
    state.master = state.actx.createGain();
    state.master.gain.value = 0.5;
    state.master.connect(state.actx.destination);
  }
  if(state.actx.state==='suspended') state.actx.resume();
}
const SCALE = [523.25,587.33,659.25,783.99,880.00,1046.50,1174.66,1318.51];
function pluck(freq, delay=0, dur=0.5, vol=0.22, type='triangle'){
  ensureAudio();
  if(!state.sfxOn || !state.actx) return;
  const t = state.actx.currentTime + delay;
  const o = state.actx.createOscillator(), g = state.actx.createGain();
  o.type = type; o.frequency.value = freq; o.detune.value = (Math.random()*8-4);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(state.master);
  o.start(t); o.stop(t+dur+0.05);
}
const noteFor = i => SCALE[i % SCALE.length];
function playLineArp(len){
  for(let i=0;i<Math.max(len,4);i++) pluck(noteFor(i), i*0.09);
}
function playFanfare(){
  [523.25,659.25,783.99,1046.50].forEach((f,i)=> pluck(f, i*0.13, 0.6, 0.24));
  pluck(1318.51, 0.56, 1.0, 0.2);
}
function playError(){ pluck(196, 0, 0.35, 0.16, 'sine'); }

/* ---------- 麦克风 ---------- */
async function enableMic(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-mic-api');
    state.stream = await navigator.mediaDevices.getUserMedia({audio:true});
    ensureAudio();
    if(!state.actx) throw new Error('no-audio');
    const src = state.actx.createMediaStreamSource(state.stream);
    state.analyser = state.actx.createAnalyser();
    state.analyser.fftSize = 1024;
    state.analyser.smoothingTimeConstant = 0.3;
    src.connect(state.analyser);
    state.micActive = true;
    return true;
  }catch(e){
    return false;
  }
}
function hasSpeech(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function setMode(m){
  const map = {speech:'语音识别', syllable:'节拍感应', demo:'演示模式'};
  $('#modeBadge').textContent = map[m] || m;
}
async function startListening(){
  if(state.walking || state.done || state.listening) return;
  ensureAudio();
  if(!state.micActive){
    const ok = await enableMic();
    if(!ok){
      // 麦克风不可用 → 提供演示模式
      state.demoMode = true;
      setMode('demo');
      $('#demoBtn').style.display = '';
      toast('未获得麦克风权限，已开启演示模式：点击麦克风可逐字点亮');
      state.listening = true;
      $('#micBtn').classList.add('listening');
      $('#micStatus').textContent = '演示模式 · 点击逐字点亮';
      return;
    }
  }
  state.listening = true;
  $('#micBtn').classList.add('listening');
  if(state.demoMode){
    setMode('demo');
    $('#micStatus').textContent = '演示模式 · 点击逐字点亮';
    return;
  }
  if(state.syllableMode){
    setMode('syllable');
    $('#micStatus').textContent = '正在聆听 · 逐字朗读';
  }else if(hasSpeech()){
    setMode('speech');
    $('#micStatus').textContent = '正在聆听…';
    startRecognition();
  }else{
    state.syllableMode = true;
    setMode('syllable');
    $('#micStatus').textContent = '正在聆听 · 逐字朗读';
    toast('已切换到节拍感应模式：请逐字大声朗读');
  }
}
function stopListening(){
  state.listening = false;
  $('#micBtn').classList.remove('listening');
  if(state.recog){ try{ state.recog.stop(); }catch(e){} state.recog = null; }
  $('#micStatus').textContent = '点击开始朗读';
}
function toggleMic(){
  if(state.done || state.walking) return;
  if(state.demoMode){
    registerSyllable();
    return;
  }
  if(state.listening) stopListening();
  else startListening();
}

/* ---------- 语音识别 ---------- */
function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(state.recog){ try{ state.recog.stop(); }catch(e){} }
  const rec = new SR();
  state.recog = rec;
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let errCount = 0;
  rec.onresult = e => {
    let txt = '';
    for(let i=e.resultIndex;i<e.results.length;i++) txt += e.results[i][0].transcript;
    handleText(txt);
  };
  rec.onerror = e => {
    if(e.error==='network' || e.error==='service-not-allowed'){
      errCount++;
      if(errCount>=2 && !state.syllableMode && !state.demoMode){
        state.syllableMode = true; setMode('syllable');
        $('#micStatus').textContent = '正在聆听 · 逐字朗读';
        toast('语音识别暂不可用，已切换为节拍感应模式');
      }
    }
  };
  rec.onend = () => {
    if(state.listening && !state.walking && !state.done){
      setTimeout(()=>{
        if(state.listening && !state.walking && !state.done){
          try{ rec.start(); }catch(e){}
        }
      }, 260);
    }
  };
  try{ rec.start(); }catch(e){}
}
function handleText(txt){
  if(state.done || state.walking || !state.listening) return;
  if(state.bridge >= bridges.length) return;
  const target = bridges[state.bridge].text;
  const norm = (txt||'').replace(/[^\u4e00-\u9fa5]/g,'');
  if(!norm) return;
  let m = 0;
  for(const ch of norm){
    if(ch === target[m]){ m++; if(m>=target.length) break; }
  }
  if(m > state.litInBridge){
    lightChars(m);
    if(m >= target.length) bridgeComplete();
  }
}

/* ---------- 点亮 / 判定 ---------- */
function lightChars(k){
  const b = bridges[state.bridge];
  const len = b.text.length;
  k = Math.min(k, len);
  for(let i=state.litInBridge;i<k;i++){
    nodeEls[b.start+i].classList.add('lit');
    pluck(noteFor(i), 0, 0.45);
  }
  state.litInBridge = Math.max(state.litInBridge, k);
  updateNodeStates();
}
function registerSyllable(){
  if(state.done || state.walking) return;
  const b = bridges[state.bridge];
  const len = b.text.length;
  if(state.litInBridge >= len) return;
  lightChars(state.litInBridge+1);
  const bar = $('#volBar');
  if(state.demoMode){
    bar.style.width = Math.min(100, state.litInBridge*100/len)+'%';
    $('#volNum').textContent = Math.round(state.litInBridge*100/len)+'%';
  }
  bar.classList.remove('flash'); void bar.getBoundingClientRect(); bar.classList.add('flash');
  if(state.litInBridge >= len) bridgeComplete();
}

/* 一座桥读完：点亮本桥 → 得星 → 小人从桥头走到桥尾石台 → 下一座桥 */
async function bridgeComplete(){
  if(state.done || state.walking) return;
  stopListening();
  state.walking = true;
  const b = bridges[state.bridge];
  const len = b.text.length;

  playLineArp(len);
  // 得星（每座桥一颗）
  state.levelStars++;
  state.stars++;
  updateStarRow(state.levelStars-1);
  spawnFloat('桥通啦！ +1 星', '56%', '28%');

  // 先走到桥头（起点悬崖或上一座桥尾石台）
  const startPt = state.bridge===0
    ? {x:210, y:612}
    : {x:platforms[state.bridge-1].x, y:platforms[state.bridge-1].ty - 2};
  if(Math.hypot(startPt.x-state.charPos.x, startPt.y-state.charPos.y) > 2) await hopTo(startPt, 420);
  // 逐字走过本桥
  for(let k=0;k<len;k++) await hopTo({x:b.xs[k], y:b.ys[k]+24}, 430);
  // 走到桥尾：衔接石台或终点悬崖
  const endPt = state.bridge===bridges.length-1
    ? {x:cliffR.left+34, y:cliffR.top-2}
    : {x:platforms[state.bridge].x, y:platforms[state.bridge].ty - 2};
  await hopTo(endPt, 430);

  state.bridge++;
  state.litInBridge = 0;
  if(state.bridge >= bridges.length){ await finishLevel(); return; }
  renderBridgePanel(state.bridge);
  state.walking = false;
  setTimeout(()=>{ startListening(); }, 650);
}

async function finishLevel(){
  state.walking = false;
  state.done = true;
  playFanfare();
  const lv = LEVELS[state.level];
  const earned = bridges.length;
  if(state.stars > state.best){
    state.best = state.stars;
    try{ localStorage.setItem('sycsb_best', String(state.best)); }catch(e){}
  }
  $('#doneTitle').textContent = '「'+lv.title+'」通关啦';
  $('#doneStars').textContent = '★ '.repeat(state.levelStars).trim();
  $('#doneTotal').textContent = '累计星星 '+state.stars+' / '+TOTAL_STARS;
  $('#nextBtn').textContent = state.level < LEVELS.length-1 ? '下一关' : '再玩一次';
  $('#doneOverlay').classList.remove('hide');
  burstStars();
  spawnFloat('走过悬崖啦！', '50%', '46%');
}

/* ---------- 特效 ---------- */
let toastTimer=null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
function spawnFloat(text, lx, ly){
  const d = document.createElement('div');
  d.className = 'float';
  d.textContent = text;
  d.style.left = lx; d.style.top = ly;
  d.style.transform = 'translateX(-50%)';
  fxLayer.appendChild(d);
  setTimeout(()=> d.remove(), 1400);
}
function burstStars(){
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);';
  fxLayer.appendChild(d);
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.className = 'starburst';
    s.textContent = '★';
    const ang = (i/10)*Math.PI*2;
    s.style.setProperty('--dx', (Math.cos(ang)*140)+'px');
    s.style.setProperty('--dy', (Math.sin(ang)*90-40)+'px');
    s.style.animationDelay = (i*0.05)+'s';
    d.appendChild(s);
  }
  setTimeout(()=> d.remove(), 1400);
}

/* ---------- 主循环 ---------- */
function loop(){
  requestAnimationFrame(loop);
  // 待机呼吸
  if(!state.walking){
    const t = performance.now();
    const bob = Math.sin(t/380)*3;
    setChar(state.charPos.x, state.charPos.y + bob, 0, 1 + Math.sin(t/520)*0.015, state.charPos.y);
  }
  // 音量检测
  if(state.micActive && state.analyser){
    const data = new Uint8Array(state.analyser.fftSize);
    state.analyser.getByteTimeDomainData(data);
    let sum=0;
    for(let i=0;i<data.length;i++){ const d=(data[i]-128)/128; sum += d*d; }
    const rms = Math.sqrt(sum/data.length);
    const pct = Math.min(100, Math.round(rms/0.5*100));
    $('#volBar').style.width = pct+'%';
    $('#volNum').textContent = pct+'%';
    if(state.syllableMode && state.listening && !state.walking && !state.done){
      const gate = 0.04 + state.sens/100*0.12;
      const now = performance.now();
      if(rms > gate && now - state.lastPeak > 300){
        state.lastPeak = now;
        registerSyllable();
      }
    }
  }
}

/* ---------- 事件 ---------- */
$('#startBtn').addEventListener('click', ()=>{
  $('#startOverlay').classList.add('hide');
  buildLevel();
  startListening();
});
$('#nextBtn').addEventListener('click', ()=>{
  $('#doneOverlay').classList.add('hide');
  if(state.level >= LEVELS.length-1){
    state.level = 0;
    state.stars = 0;
  }else{
    state.level++;
  }
  state.levelStars = 0;
  state.done = false;
  buildLevel();
  startListening();
});
$('#micBtn').addEventListener('click', toggleMic);
$('#sensSlider').addEventListener('input', e=>{
  state.sens = +e.target.value;
  $('#sensNum').textContent = state.sens;
});
$('#sfxBtn').addEventListener('click', ()=>{
  state.sfxOn = !state.sfxOn;
  $('#sfxBtn').textContent = state.sfxOn ? '音效 开' : '音效 关';
});
$('#demoBtn').addEventListener('click', ()=>{
  state.demoMode = true;
  setMode('demo');
  $('#micStatus').textContent = '演示模式 · 点击逐字点亮';
  toast('演示模式：点击麦克风逐字点亮');
  stopListening();
});

/* ---------- 启动 ---------- */
buildLevel();
loop();
</script>
